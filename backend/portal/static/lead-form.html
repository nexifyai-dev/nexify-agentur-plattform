<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeXifyAI — Kontakt</title>
<link rel="stylesheet" href="/nexifyai-tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --card: #18181b; --border: #27272a; --text: var(--white); --green: #22c55e; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-body,'Outfit',system-ui,sans-serif); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 480px; margin: 1rem; }
h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: .25rem; }
.sub { color: var(--muted); margin-bottom: 1.5rem; font-size: .9rem; }
input, textarea { width: 100%; padding: .75rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: .95rem; margin-bottom: 1rem; }
textarea { min-height: 100px; resize: vertical; }
button { width: 100%; padding: .75rem; background: var(--green); color: #000; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
button:hover { opacity: .9; }
#status { margin-top: 1rem; padding: .75rem; border-radius: 8px; display: none; }
#status.success { display: block; background: rgba(34,197,94,.15); color: var(--green); }
#status.error { display: block; background: rgba(239,68,68,.15); color: #ef4444; }
.hint { color: var(--muted); font-size: .8rem; margin-top: -.5rem; margin-bottom: 1rem; }
</style>
</head>
<body>
<div class="card">
<h1>NeXifyAI</h1>
<p class="sub">KI-Automation für Ihren Erfolg. Wir melden uns innerhalb von 24h.</p>
<form id="leadForm">
  <input type="text" name="name" placeholder="Ihr Name" required>
  <input type="email" name="email" placeholder="Ihre E-Mail" required>
  <input type="text" name="company" placeholder="Unternehmen (optional)">
  <textarea name="message" placeholder="Was können wir für Sie tun?"></textarea>
  <button type="submit">Anfrage senden</button>
</form>
<div id="status"></div>
<div class="hint" style="margin-top:1rem">🚀 Angetrieben durch NeXifyAI Auto-Work Infrastructure</div>
</div>
<script>
document.getElementById('leadForm').onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = Object.fromEntries(fd);
  data.source = 'website-formular';
  
  const status = document.getElementById('status');
  try {
    const r = await fetch('https://admin.nexifyai.cloud/api/leads', { 
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    if (r.ok) {
      status.className = 'success';
      status.textContent = '✅ Vielen Dank! Wir melden uns bei Ihnen.';
      e.target.reset();
    } else {
      status.className = 'error';
      status.textContent = '❌ Fehler beim Senden. Bitte versuchen Sie es später.';
    }
  } catch (e) {
    status.className = 'error';
    status.textContent = '❌ Verbindungsfehler. Bitte versuchen Sie es später.';
  }
};
</div>
<script src="/nav-widget.js"></script>
</body>
</html>
