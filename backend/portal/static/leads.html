<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeXifyAI — Lead Console</title>
<link rel="stylesheet" href="/nexifyai-tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --card: #18181b; --border: #27272a; --text: var(--white); --green: #22c55e; --blue: var(--info); --orange: var(--warning); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-body,'Outfit',system-ui,sans-serif); background: var(--bg); color: var(--text); padding: 1.5rem; }
h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 1rem; }
.sub { color: var(--muted); font-size: .85rem; margin-bottom: 1.5rem; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: .6rem .8rem; color: var(--muted); font-weight: 500; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); }
td { padding: .6rem .8rem; border-bottom: 1px solid var(--border); font-size: .85rem; }
tr:hover td { background: rgba(255,255,255,0.03); }
.tag { display: inline-block; padding: .15rem .5rem; border-radius: 4px; font-size: .7rem; font-weight: 500; }
.tag.new { background: rgba(59,130,246,.12); color: var(--blue); }
.tag.contacted { background: rgba(245,158,11,.12); color: var(--orange); }
.tag.demoed { background: rgba(34,197,94,.12); color: var(--green); }
.tag.demo { background: rgba(34,197,94,.12); color: var(--green); cursor: pointer; }
.tag.demo:hover { background: rgba(34,197,94,.25); }
.actions { display: flex; gap: .3rem; }
.actions button { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: .25rem .6rem; border-radius: 4px; font-size: .75rem; cursor: pointer; }
.actions button:hover { border-color: var(--green); }
.source { font-size: .75rem; color: var(--muted); }
.time { font-size: .75rem; color: var(--muted); }
#loading { text-align: center; padding: 3rem; color: var(--muted); }
.stats { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: .8rem 1.2rem; text-align: center; min-width: 100px; }
.stat .num { font-size: 1.4rem; font-weight: 700; }
.stat .lbl { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
</style>
</head>
<body>
<h1>Lead Console</h1>
<p class="sub">Lead-Management für NeXifyAI — Live aus der Lead-Pipeline</p>
<div id="stats" class="stats"><div class="stat"><div class="num">-</div><div class="lbl">Leads</div></div></div>
<div id="app"><div id="loading">Lade Lead-Daten...</div></div>
<script>
async function load() {
  const el = document.getElementById('app');
  const stats = document.getElementById('stats');
  try {
    const r = await fetch('/api/system/intelligence');
    const sys = await r.json();
    
    const r2 = await fetch('https://admin.nexifyai.cloud/api/leads');
    const data = await r2.json();
    const leads = data.leads || data || [];
    const total = Array.isArray(leads) ? leads : [];
    
    stats.innerHTML = `
      <div class="stat"><div class="num" style="color:var(--blue)">${total.length}</div><div class="lbl">Total</div></div>
      <div class="stat"><div class="num" style="color:var(--blue)">${sys.ninerouter.models}</div><div class="lbl">KI Modelle</div></div>
      <div class="stat"><div class="num" style="color:var(--green)">${sys.docker.running}</div><div class="lbl">Container</div></div>
    `;
    
    if (!total.length) { el.innerHTML = '<p style="color:var(--muted)">Keine Leads gefunden</p>'; return; }
    
    let html = '<table><tr><th>Name</th><th>E-Mail</th><th>Quelle</th><th>Datum</th><th>Status</th><th>Demo</th></tr>';
    for (const lead of [...total].reverse()) {
      const demoUrl = `/api/demo/${lead.id}`;
      html += `<tr>
        <td><strong>${lead.name}</strong></td>
        <td><span class="time">${lead.email || '-'}</span></td>
        <td><span class="source">${lead.source || '-'}</span></td>
        <td><span class="time">${(lead.created_at || '').slice(0, 10)}</span></td>
        <td><span class="tag new">new</span></td>
        <td><a class="tag demo" href="${demoUrl}" target="_blank">Demo ansehen</a></td>
      </tr>`;
    }
    html += '</table>';
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<p style="color:#ef4444">Fehler: ${e.message}</p>`;
  }
}
load();
setInterval(load, 30000);
</script>
<script src="/nav-widget.js"></script>
</body>
</html>
