      - security-headers
      - csp-strict
      tls:
        certResolver: letsencrypt
    dashboard-subdomain:
      rule: Host(`dashboard.nexifyai.cloud`)
      service: hermes-workspace-svc
      priority: 350
      entryPoints:
      - websecure
      middlewares:
      - security-headers
      - rate-limit
      tls:
        certResolver: letsencrypt
  services:
    portal:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:4001
    auth-service:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:8881
    hermes-webui:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:8787
    ninerouter:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:20128
    agentmemory-viewer:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:3113
    open-design:
      loadBalancer:
        servers:
        # IST 2026-07-31: OpenDesign/html-anything on :3002 (8902 was stale 404)
        - url: http://127.0.0.1:3002
    lightrag:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:9621
    spaether-api:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:8900
    vitrine:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:8901
    grafana:
      loadBalancer:
        servers:
        # IST 2026-08-10: nexify-grafana bind 127.0.0.1:3030 (GF_SERVER_HTTP_PORT=3030)
        - url: http://127.0.0.1:3030
    prometheus:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:9090
    twenty:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:3001
    html-anything:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:3002
    gitlab:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:8922
    vitrine-service:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:8901
    cockpit-svc:
      loadBalancer:
        servers:
        - url: http://127.0.0.1:8904
    hermes-dashboard-svc:
      loadBalancer:
        passHostHeader: false
        servers:
        - url: http://127.0.0.1:9119
    hermes-workspace-svc:
      loadBalancer:
        passHostHeader: true
        servers:
        - url: http://127.0.0.1:4001
  middlewares:
    dashboard-host-fix:
      headers:
        customRequestHeaders:
          Host: "127.0.0.1:9119"
          X-Forwarded-Host: "127.0.0.1:9119"
          X-Forwarded-For: "127.0.0.1"
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        customFrameOptionsValue: SAMEORIGIN
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: camera=(), microphone=(), geolocation=(), interest-cohort=()
        customResponseHeaders:
          X-Powered-By: ''
          Server: ''
          Cross-Origin-Opener-Policy: same-origin
          Cross-Origin-Embedder-Policy: credentialless
          Cross-Origin-Resource-Policy: same-origin
    csp-strict:
      headers:
        contentSecurityPolicy: 'default-src ''self''; script-src ''self'' ''unsafe-inline'';
          style-src ''self'' ''unsafe-inline''; img-src ''self'' data: https:; font-src
          ''self'' https://fonts.bunny.net; connect-src ''self'' https: wss:; frame-ancestors
          ''self''; base-uri ''self'''
    csp-iframe:
      headers:
        contentSecurityPolicy: 'default-src * ''unsafe-inline'' ''unsafe-eval'' data:
          blob:; frame-ancestors *; frame-src *'
        customFrameOptionsValue: ''
    auth-forward:
      forwardAuth:
        address: http://127.0.0.1:8881/verify
        trustForwardHeader: true
        authResponseHeaders:
        - X-User-Id
        - X-User-Email
        - X-User-Role
    strip-prefix-factory:
      stripPrefix:
        prefixes:
        - /factory
    strip-prefix-wissen:
      stripPrefix:
        prefixes:
        - /wissen
    strip-prefix-lightrag:
      stripPrefix:
        prefixes:
        - /wissen
    strip-prefix-leads:
      stripPrefix:
        prefixes:
        - /leads
    strip-prefix-api-leads:
      stripPrefix:
        prefixes:
        - /api/leads
    redirect-api-leads-slash:
      redirectRegex:
        regex: ^/api/leads$
        replacement: /api/leads/
        permanent: true
    strip-prefix-workstation:
      stripPrefix:
        prefixes:
        - /workstation
    strip-prefix-router:
      stripPrefix:
        prefixes:
        - /router
    strip-prefix-auth:
      stripPrefix:
        prefixes:
        - /auth
    redirect-logout:
      redirectRegex:
        regex: ^.*/auth/logout.*
        replacement: https://www.nexifyai.cloud/
        permanent: false
    redirect-router-sub:
      redirectRegex:
        regex: ^https://router\.nexifyai\.cloud/(.*)
        replacement: https://admin.nexifyai.cloud/router/${1}
        permanent: true
    strip-prefix-demo:
      stripPrefix:
        prefixes:
        - /demo
    strip-prefix-memory:
      stripPrefix:
        prefixes:
        - /memory
    strip-prefix-html:
      stripPrefix:
        prefixes:
        - /html
    strip-prefix-grafana:
      stripPrefix:
        prefixes:
        - /grafana
    strip-prefix-twenty:
      stripPrefix:
        prefixes:
        - /crm
    strip-prefix-prometheus:
      stripPrefix:
        prefixes:
        - /monitoring
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1
    rate-limit-factory:
      rateLimit:
        average: 500
        burst: 600
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1
    redirect-workstation:
      redirectRegex:
        regex: ^https://admin\.nexifyai\.cloud/workstation(.*)
        replacement: https://webui.nexifyai.cloud${1}
        permanent: true
    cors-9router:
      headers:
        accessControlAllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - PATCH
        accessControlAllowHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
        - Accept
        accessControlAllowOriginList:
        - https://ai-router.nexifyai.cloud
        accessControlAllowCredentials: true
        accessControlMaxAge: 86400
