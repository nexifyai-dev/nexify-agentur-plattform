http:
  routers:
    portal:
      rule: Host(`admin.nexifyai.cloud`)
      service: portal
      priority: 1
      entryPoints:
      - websecure
      middlewares:
      - security-headers
      - csp-strict
      - auth-forward
      - rate-limit
      tls:
        certResolver: letsencrypt
    portal-health:
      rule: Host(`admin.nexifyai.cloud`) && Path(`/health`)
      service: portal
      priority: 200
      entryPoints:
      - websecure
      middlewares:
      - security-headers
      - rate-limit
      tls:
        certResolver: letsencrypt
    portal-sse:
      rule: Host(`admin.nexifyai.cloud`) && Path(`/api/sse/events`)
      service: portal
      priority: 200
      entryPoints:
      - websecure
      middlewares:
      - security-headers
      - rate-limit
      tls:
        certResolver: letsencrypt
    portal-static:
      rule: Host(`admin.nexifyai.cloud`) && (PathPrefix(`/dashboard/assets`) || PathPrefix(`/dashboard`))
        || Path(`/favicon.svg`) || Path(`/nexifyai-tokens.css`) || Path(`/logo.svg`)
        || Path(`/impressum.html`) || Path(`/datenschutz.html`) || Path(`/agb.html`)
        || Path(`/avv.html`) || Path(`/widerruf.html`) || Path(`/cookie-richtlinie.html`)
        || Path(`/ki-hinweise.html`) || Path(`/barrierefreiheit.html`) || Path(`/nutzungsbedingungen.html`)
      service: portal
      priority: 190
      entryPoints:
      - websecure
      middlewares:
      - security-headers
      - csp-strict
      - auth-forward
      tls: null
    api-gateway:
      rule: Host(`admin.nexifyai.cloud`) && PathPrefix(`/api`)
      service: portal
      priority: 150
      entryPoints:
      - websecure
      middlewares:
      - security-headers
      - rate-limit
      - csp-strict
      - auth-forward
      tls:
        certResolver: letsencrypt
    auth:
      rule: Host(`admin.nexifyai.cloud`) && PathPrefix(`/auth`)
