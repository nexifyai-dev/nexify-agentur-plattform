# WHAT: Pytest markers — unit (offline) vs integration (remote env).
# WHY: Issue #167 harden CI beyond continue-on-error for all tests.
# BEST-PRACTICE: CI runs unit fail-hard; integration optional/gated.
# PITFALL: V-CI-02: Default collection still finds integration; CI must pass paths explicitly.
# DEPENDS: pytest
# DOCS-REF: docs/operations/QUALITY-GATES.md
# SESSION: issues-quality-ci-7dd5

[pytest]
markers =
    unit: offline contracts (no DB / no remote URL)
    integration: needs REACT_APP_BACKEND_URL / live services
testpaths = tests
python_files = test_*.py
addopts = -q
