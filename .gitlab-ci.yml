variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# === LINT ===
lint:
  stage: lint
  image: node:20-alpine
  script:
    - npm install --prefer-offline
    - npm run lint 2>&1 || true
  allow_failure: true
  only:
    - branches

# === TEST ===
test:
  stage: test
  image: node:20-alpine
  script:
    - npm install --prefer-offline
    - npm run test 2>&1 || true
  allow_failure: true
  only:
    - branches
  artifacts:
    reports:
      junit: test-results.xml
    paths:
      - coverage/
    expire_in: 30 days

# === BUILD ===
build:vitrine:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -f deploy/docker/Dockerfile.vitrine -t $DOCKER_IMAGE:vitrine-$CI_COMMIT_SHA -t $DOCKER_IMAGE:vitrine-latest ./apps/vitrine
    - docker push $DOCKER_IMAGE:vitrine-$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE:vitrine-latest
  only:
    - main
    - develop

build:backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -f deploy/docker/Dockerfile.backend -t $DOCKER_IMAGE:backend-$CI_COMMIT_SHA -t $DOCKER_IMAGE:backend-latest ./backend
    - docker push $DOCKER_IMAGE:backend-$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE:backend-latest
  only:
    - main
    - develop

