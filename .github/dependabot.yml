# FILE: .github/dependabot.yml
# NIR: 02.08.2026 09:20
# UPDATED: 02.08.2026 09:30
# NAME: NeXifyAI Agent
# TEAM: NeXifyAI DevOps
# WHAT: Dependabot updates for website (pnpm), backend (pip), and GitHub Actions
# WHY: Security bumps (#143 next) + litellm path without manual chase; rebase onto #148 base
# BEST-PRACTICE: Group minor/patch; open PRs against main; label automerge for safe patches
# PITFALL: Do not auto-merge major without CI green; never force-push main; litellm majors need human review
# DEPENDS: GitHub Dependabot enabled on repo
# DOCS-REF: docs/operations/PRODUCTION-READINESS-BOARD.md
# SESSION: production-readiness-close-7dd5

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 8
    target-branch: "main"
    labels:
      - "dependencies"
      - "automerge"
    commit-message:
      prefix: "chore(deps)"
    groups:
      website-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 8
    target-branch: "main"
    labels:
      - "dependencies"
      - "python"
      - "security"
      - "automerge"
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    target-branch: "main"
    labels:
      - "dependencies"
      - "github-actions"
      - "automerge"
    commit-message:
      prefix: "chore(deps)"
