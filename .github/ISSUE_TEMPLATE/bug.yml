# FILE: .github/ISSUE_TEMPLATE/bug.yml
# NIR: 02.08.2026 08:55
# NAME: NeXifyAI Agent
# TEAM: NeXifyAI DevOps
# WHAT: Bug report template for Issues Lifecycle automation.
# DOCS-REF: docs/operations/ISSUES-AUTOMATION.md

name: Bug report
description: Etwas funktioniert nicht (Code / CI / Runtime)
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Bitte **keine Secret-Werte** einfügen. Cursor Cloud Agent triage't automatisch.
  - type: textarea
    id: summary
    attributes:
      label: Zusammenfassung
      description: Was ist kaputt?
      placeholder: Erwartet X, beobachtet Y…
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro-Schritte
      description: Minimaler Repro
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [P0, P1, P2, P3]
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Evidence / URL
      description: CI-Run, Log-Pfad, Screenshot-Link (ohne Secrets)
