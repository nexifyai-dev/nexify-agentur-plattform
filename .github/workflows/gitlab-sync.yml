# FILE: .github/workflows/gitlab-sync.yml
# NIR: 24.07.2026 13:15
# UPDATED: 27.07.2026 10:56
# NAME: NeXifyAI Agent (GitHub ↔ GitLab Sync)
# TEAM: NeXifyAI DevOps
# WHAT: Mirror repository zu GitLab OSS + trigger CI/CD Pipeline
# WHY: Dual-CI (GitHub Actions + GitLab Pipeline); CF-Tunnel-first public URL
# BEST-PRACTICE: https://gitlab.nexifyai.cloud — nicht interner VPS-Bind von GitHub Runners
# PITFALL: V-GL-SYNC-01: Hostinger-Intern-Host von GH Actions unerreichbar
# DEPENDS: secrets.GITLAB_TOKEN (api + write_repository) oder VPS_GITLAB_TOKEN
# DOCS-REF: docs/operations/REPO-SYNC-STRATEGY.md

name: Sync to GitLab + Trigger Pipeline

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: gitlab-sync
  cancel-in-progress: false

env:
  # Public CF-Tunnel endpoint (GitHub Actions cannot reach VPS :8922 bind)
  GITLAB_API_URL: https://gitlab.nexifyai.cloud/api/v4
  GITLAB_HOST: gitlab.nexifyai.cloud
  GITLAB_GROUP: nexifyai
  GITLAB_PROJECT: nexify-agentur-plattform

jobs:
  sync-to-gitlab:
    runs-on: ubuntu-latest
    name: Mirror → GitLab + Trigger
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve GitLab token
        id: tok
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          VPS_GITLAB_TOKEN: ${{ secrets.VPS_GITLAB_TOKEN }}
        run: |
          T="${GITLAB_TOKEN:-$VPS_GITLAB_TOKEN}"
          if [ -z "$T" ]; then
            echo "::warning::GITLAB_TOKEN / VPS_GITLAB_TOKEN missing — sync skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$T"
          echo "token=$T" >> "$GITHUB_OUTPUT"

      - name: Configure Git
        if: steps.tok.outputs.present == 'true'
        run: |
          git config --global user.email "ci@nexifyai.cloud"
          git config --global user.name "NeXifyAI CI"

      - name: Push mirror to GitLab OSS
        if: steps.tok.outputs.present == 'true'
        env:
          TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          REMOTE="https://oauth2:${TOKEN}@${GITLAB_HOST}/${GITLAB_GROUP}/${GITLAB_PROJECT}.git"
          git remote remove gitlab 2>/dev/null || true
          git remote add gitlab "$REMOTE"
          git push gitlab "HEAD:refs/heads/${GITHUB_REF_NAME}" --force

      - name: Trigger GitLab Pipeline
        if: steps.tok.outputs.present == 'true'
        env:
          TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          ENC=$(python3 -c "import urllib.parse;print(urllib.parse.quote('${GITLAB_GROUP}/${GITLAB_PROJECT}',safe=''))")
          PROJECT_ID=$(curl -sS -H "PRIVATE-TOKEN: $TOKEN" \
            "${GITLAB_API_URL}/projects/${ENC}" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" || true)
          if [ -z "$PROJECT_ID" ]; then
            echo "::warning::GitLab project not found: ${GITLAB_GROUP}/${GITLAB_PROJECT}"
            exit 0
          fi
          echo "Triggering pipeline for project $PROJECT_ID ref=${GITHUB_REF_NAME}"
          curl -sS -X POST "${GITLAB_API_URL}/projects/${PROJECT_ID}/pipeline" \
            -H "PRIVATE-TOKEN: $TOKEN" \
            -d "ref=${GITHUB_REF_NAME}" | python3 -c "import sys,json;d=json.load(sys.stdin);print('pipeline',d.get('id'),d.get('status'))"
