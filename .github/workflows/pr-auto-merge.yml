# FILE: .github/workflows/pr-auto-merge.yml
# NIR: 02.08.2026 08:25
# UPDATED: 02.08.2026 08:25
# NAME: NeXifyAI Agent
# TEAM: NeXifyAI DevOps
# WHAT: Label-basiertes Auto-Merge für grüne PRs (kein Force-Main).
# WHY: Cursor-/Agent-PRs sollen nach CI + Guards mergen, ohne Blind-Merge.
# BEST-PRACTICE: Nur Squash+Auto-Merge API; Draft/do-not-merge/base≠main blocken.
# PITFALL: V-AM-01: Ohne required checks ist enableAutoMerge wirkungslos → Branch Protection nötig.
# DEPENDS: Repo Settings → Rulesets/Branch protection (required status checks)
# DOCS-REF: docs/operations/AGENT-TRIGGERS-INTEGRATIONS.md
# SESSION: agent-triggers-integrations-7dd5

name: PR Auto-Merge (label-gated)

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, opened, reopened, ready_for_review]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["CI — Test & Lint"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: pr-auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  enable-automerge:
    if: github.repository == 'nexifyai-dev/nexify-agentur-plattform'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WR_PRS: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          number=""
          if [ -n "${PR_NUMBER:-}" ]; then
            number="$PR_NUMBER"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            number="$(printf '%s' "$WR_PRS" | jq -r '.[0].number // empty')"
          fi
          if [ -z "$number" ]; then
            echo "no_pr=1" >> "$GITHUB_OUTPUT"
            echo "No PR context — skip"
            exit 0
          fi
          echo "no_pr=0" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Gate and enable auto-merge
        if: steps.pr.outputs.no_pr == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          meta="$(gh pr view "$PR" --repo "$REPO" --json number,isDraft,baseRefName,labels,title,state,mergeable,statusCheckRollup)"
          echo "$meta" | jq '{number,isDraft,baseRefName,state,mergeable,labels:[.labels[].name]}'

          state="$(echo "$meta" | jq -r .state)"
          is_draft="$(echo "$meta" | jq -r .isDraft)"
          base="$(echo "$meta" | jq -r .baseRefName)"
          labels="$(echo "$meta" | jq -r '[.labels[].name] | join(",")')"

          if [ "$state" != "OPEN" ]; then
            echo "skip: PR not open"
            exit 0
          fi
          if [ "$is_draft" = "true" ]; then
            echo "skip: draft PR"
            exit 0
          fi
          if [ "$base" != "main" ]; then
            echo "skip: base branch '$base' not allowlisted"
            exit 0
          fi
          if echo "$labels" | tr ',' '\n' | grep -qx 'do-not-merge'; then
            echo "skip: do-not-merge label"
            gh pr merge "$PR" --repo "$REPO" --disable-auto || true
            exit 0
          fi
          if ! echo "$labels" | tr ',' '\n' | grep -Eqx 'automerge|auto-merge'; then
            echo "skip: missing automerge/auto-merge label"
            exit 0
          fi

          # Fail closed on known failing required-ish checks when rollup present
          failing="$(echo "$meta" | jq -r '
            [.statusCheckRollup[]?
              | select(.conclusion != null and .conclusion != "SUCCESS" and .conclusion != "NEUTRAL" and .conclusion != "SKIPPED")
              | .name] | unique | join(", ")')"
          if [ -n "$failing" ]; then
            echo "skip: failing checks: $failing"
            exit 0
          fi

          # Enable GitHub native auto-merge (squash). Requires repo auto-merge + branch protection.
          if gh pr merge "$PR" --repo "$REPO" --auto --squash; then
            echo "auto-merge enabled for #$PR"
          else
            echo "::warning::Could not enable auto-merge (check: Settings → General → Allow auto-merge + branch protection required checks)"
            exit 0
          fi
