name: Mirror to VPS GitLab

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: github.repository == 'nexifyai-dev/nexify-agentur-plattform'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to VPS GitLab
        run: |
          if [ -z "$VPS_GITLAB_URL" ]; then
            echo "::warning::VPS_GITLAB_URL secret is not set; skipping mirror push"
            exit 0
          fi
          git remote add gitlab "$VPS_GITLAB_URL"
          git push --mirror gitlab
        env:
          VPS_GITLAB_URL: ${{ secrets.VPS_GITLAB_URL }}
