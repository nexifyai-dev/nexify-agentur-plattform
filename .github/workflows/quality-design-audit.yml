# FILE: .github/workflows/quality-design-audit.yml
# NIR: 02.08.2026 09:50
# UPDATED: 02.08.2026 11:24
# NAME: NeXifyAI Agent
# TEAM: NeXifyAI Quality
# WHAT: Full Playwright design-audit with screenshot artifacts for website/CI PRs plus nightly.
# WHY: Close issue #166 for relevant PRs without paying runtime cost on unrelated changes.
# BEST-PRACTICE: trigger on website/CI paths + nightly/dispatch, keep artifacts always.
# PITFALL: V-QA-02: Scope expensive audits to relevant PR paths, not every repo change.
# DEPENDS: apps/website Playwright; pnpm 9; Node 20
# DOCS-REF: docs/operations/QUALITY-GATES.md
# SESSION: issues-quality-ci-7dd5

name: Quality Design Audit

on:
  schedule:
    - cron: "0 4 * * *"
  pull_request:
    branches: [main]
    paths:
      - "apps/website/**"
      - ".github/workflows/quality-design-audit.yml"
      - ".github/workflows/quality-smoke.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/test.yml"
  workflow_dispatch:


concurrency:
  group: quality-design-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  design-audit:
    name: Playwright design-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/website/pnpm-lock.yaml

      - name: Install website deps
        run: pnpm --dir apps/website install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --dir apps/website exec playwright install --with-deps chromium

      - name: Build website
        run: pnpm --dir apps/website build

      - name: Run design-audit.spec.ts
        working-directory: apps/website
        env:
          CI: "true"
        run: pnpm exec playwright test tests/e2e/design-audit.spec.ts --reporter=list
        continue-on-error: true

      - name: Upload Playwright report + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-audit-${{ github.run_id }}
          path: |
            apps/website/playwright-report/
            apps/website/test-results/
          if-no-files-found: ignore
          retention-days: 14
