# FILE: /.github/workflows/lead-outreach-daily.yml
# NIR: 02.08.2026 09:20
# UPDATED: 02.08.2026 11:05
# NAME: NeXifyAI Agent
# TEAM: NeXifyAI DevOps
# WHAT: Daily outreach DRY-RUN only until consent queue exists (§7 UWG)
# WHY: Cursor/VPS automation must not enable illegal cold send in DE
# BEST-PRACTICE: Force OUTREACH_LIVE=0; self-hosted runner; human-gate on SMTP
# PITFALL: V-OUT-01/UWG-01: Never enable live via schedule/dispatch until opt-in queue
# DEPENDS: /etc/nexifyai/secrets.env (IMAP_*/SMTP_*), scripts/outreach/run_daily.py
# DOCS-REF: docs/operations/LEAD-OUTREACH-AUTOMATION.md, docs/gtm/UWG-EMAIL-OPTIN-ONLY.md
# SESSION: zero-cost-leads-mailing-7dd5

name: Lead Outreach Daily

on:
  schedule:
    # 07:30 UTC ≈ 09:30 Europe/Berlin — dry-run queue health only
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      dispatch_agent_on_fail:
        description: "repository_dispatch Cursor agent on failure"
        required: false
        default: true
        type: boolean
  # Kept for agents, but ALWAYS dry-run (no live path until consent queue)
  repository_dispatch:
    types: [lead-outreach-run]

concurrency:
  group: lead-outreach-daily
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  outreach:
    name: Hostinger drip DRY-RUN (§7 UWG)
    runs-on: [self-hosted, vps, nexifyai]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Run daily outreach (forced dry-run)
        id: run
        env:
          SECRETS_FILE: /etc/nexifyai/secrets.env
          # HARD: §7 UWG — no cold live send from CI until consent queue exists
          OUTREACH_LIVE: "0"
          OUTREACH_DAILY_CAP: "800"
          OUTREACH_PACE_MIN_SEC: "30"
          OUTREACH_PACE_MAX_SEC: "60"
          FIRECRAWL_URL: "http://127.0.0.1:3003"
        run: |
          set +e
          # Explicitly ignore any OUTREACH_LIVE from secrets.env
          export OUTREACH_LIVE=0
          echo "UWG: workflow is dry-run only (consent queue not enabled for live CI send)"
          python3 scripts/outreach/run_daily.py --dry-run --json --secrets-file "$SECRETS_FILE" | tee /tmp/outreach-result.json
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          blocked=""
          if [ -f /tmp/outreach-result.json ]; then
            blocked=$(python3 -c "import json; d=json.load(open('/tmp/outreach-result.json')); print(d.get('blocked') or '')" 2>/dev/null || true)
          fi
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Human-gate comment if SMTP missing
        if: steps.run.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOCKED: ${{ steps.run.outputs.blocked }}
        run: |
          set -euo pipefail
          body=$(printf '%s\n' \
            '## Lead Outreach — HUMAN-GATE' \
            '' \
            'Daily outreach exited with code 2 (credentials / hard block).' \
            '' \
            "- blocked: \`${BLOCKED:-unknown}\`" \
            '- Required env (names only): `SMTP_HOST`, `SMTP_PORT`, `SMTP_USER`/`IMAP_USER`, `SMTP_PASSWORD`/`IMAP_PASSWORD`' \
            '- Mailbox: `mail@nexifyai.cloud` (Hostinger)' \
            '- **§7 UWG:** CI workflow is **dry-run only**. Live send needs `consent=true` opt-in queue (not seeds).' \
            '- Cap: ≤800/day · pacing 30–60s · channel: Hostinger SMTP (not Resend)' \
            '' \
            'See `docs/gtm/UWG-EMAIL-OPTIN-ONLY.md` and `docs/operations/LEAD-OUTREACH-AUTOMATION.md`.')
          if gh issue view 123 --json state -q .state 2>/dev/null | grep -qi open; then
            gh issue comment 123 --body "$body"
          else
            gh issue create \
              --title "[ops] Lead outreach blocked — Hostinger SMTP credentials" \
              --label "ops,human-gate,blocked,P0" \
              --body "$body" || true
          fi

      - name: Dispatch Cursor Cloud Agent on failure
        if: steps.run.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/${REPO}/dispatches" \
            -f event_type=agent-fix \
            -f client_payload[source]=lead-outreach-daily \
            -f client_payload[dedupe_key]="lead-outreach-${RUN_ID}" \
            -f client_payload[prompt]="Lead outreach daily dry-run had errors. Inspect data/outreach/state/errors.jsonl and scripts/outreach/. Do NOT enable live cold send. §7 UWG: consent=true required. No Hermes cutover." \
            || true

      - name: Fail job on hard errors
        if: steps.run.outputs.exit_code == '1'
        run: exit 1
