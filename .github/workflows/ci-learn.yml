# FILE: .github/workflows/ci-learn.yml
# NIR: 02.08.2026 10:05
# UPDATED: 02.08.2026 10:10
# NAME: NeXifyAI Agent
# TEAM: NeXifyAI DevOps
# WHAT: Nach CI success/failure Learning-Event in AgentMemory (+ optional LightRAG).
# WHY: Continuous learning across merges/fails without requiring CURSOR_API_KEY.
# BEST-PRACTICE: Soft-skip without secrets; never log tokens; DE + Europe/Berlin.
# PITFALL: V-LEARN-03: Hard-fail CI because Brain unreachable — continue-on-error.
# DEPENDS: optional AGENTMEMORY_SECRET, AGENTMEMORY_URL, LIGHTRAG_URL, LIGHTRAG_API_KEY
# DOCS-REF: docs/operations/CONTINUOUS-LEARNING.md
# SESSION: continuous-learning-7dd5

name: CI → Continuous Learning

on:
  workflow_run:
    workflows: ["CI — Test & Lint"]
    types: [completed]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      outcome:
        description: "Manual outcome"
        required: true
        type: choice
        options: [success, failure, merged]
      title:
        description: "Event title"
        required: false
        default: manual-learn

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-learn-${{ github.event.workflow_run.id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  learn:
    if: github.repository == 'nexifyai-dev/nexify-agentur-plattform'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide outcome
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_URL: ${{ github.event.workflow_run.html_url }}
          WR_HEAD: ${{ github.event.workflow_run.head_branch }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MANUAL_OUTCOME: ${{ github.event.inputs.outcome }}
          MANUAL_TITLE: ${{ github.event.inputs.title }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          outcome=""
          title=""
          run_url=""
          ref=""
          details=""
          case "$EVENT_NAME" in
            workflow_run)
              if [ "${WR_CONCLUSION:-}" = "failure" ]; then
                outcome=failure
                title="CI failure: ${WR_HEAD:-unknown}"
                details="workflow_run conclusion=failure"
              elif [ "${WR_CONCLUSION:-}" = "success" ]; then
                outcome=success
                title="CI success: ${WR_HEAD:-unknown}"
                details="workflow_run conclusion=success"
              fi
              run_url="${WR_URL:-}"
              ref="${WR_HEAD:-}"
              ;;
            pull_request)
              if [ "${PR_MERGED:-false}" = "true" ]; then
                outcome=merged
                title="${PR_TITLE:-merged PR}"
                run_url="${PR_URL:-}"
                ref="${PR_MERGE_SHA:-}"
                details="PR merged into ${PR_BASE:-main}"
              fi
              ;;
            workflow_dispatch)
              outcome="${MANUAL_OUTCOME}"
              title="${MANUAL_TITLE:-manual}"
              ref="${GITHUB_REF_NAME}"
              run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              details="manual dispatch"
              ;;
          esac
          if [ -z "$outcome" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "No learning outcome — skip"
            exit 0
          fi
          {
            echo "skip=0"
            echo "outcome=$outcome"
            echo "title=$title"
            echo "run_url=$run_url"
            echo "ref=$ref"
            echo "details=$details"
          } >> "$GITHUB_OUTPUT"

      - name: Persist learning event
        if: steps.gate.outputs.skip == '0'
        continue-on-error: true
        env:
          AGENTMEMORY_SECRET: ${{ secrets.AGENTMEMORY_SECRET }}
          AGENTMEMORY_URL: ${{ secrets.AGENTMEMORY_URL }}
          LIGHTRAG_URL: ${{ secrets.LIGHTRAG_URL }}
          LIGHTRAG_API_KEY: ${{ secrets.LIGHTRAG_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          TZ: Europe/Berlin
          LEARN_OUTCOME: ${{ steps.gate.outputs.outcome }}
          LEARN_REF: ${{ steps.gate.outputs.ref }}
          LEARN_RUN_URL: ${{ steps.gate.outputs.run_url }}
          LEARN_TITLE: ${{ steps.gate.outputs.title }}
          LEARN_DETAILS: ${{ steps.gate.outputs.details }}
        run: |
          set -u
          if [ -z "${AGENTMEMORY_SECRET:-}" ]; then
            echo "soft_skip: AGENTMEMORY_SECRET missing — learning degraded"
            exit 0
          fi
          python3 scripts/learning/ci-learn-event.py \
            --outcome "$LEARN_OUTCOME" \
            --source "github-actions" \
            --ref "$LEARN_REF" \
            --run-url "$LEARN_RUN_URL" \
            --title "$LEARN_TITLE" \
            --details "$LEARN_DETAILS"
