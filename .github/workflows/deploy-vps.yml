# FILE: .github/workflows/deploy-vps.yml
# NIR: 24.07.2026 13:10
# NAME: NeXifyAI Agent (VPS Deployment)
# TEAM: NeXifyAI DevOps
# WHAT: Automated deployment zu VPS via SSH — docker-compose pull+up
# WHY: GitOps model — main branch auto-deployed nach Test+Build
# DEPENDS: SSH key (DEPLOY_KEY_VPS), VPS-Secrets (HOST, USER, PORT)
# DOCS-REF: docs/architecture/HERMES-GITHUB-WORKFLOW.md

name: Deploy to VPS (main → production)

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

concurrency:
  group: deploy-vps
  cancel-in-progress: false  # Deployments serialisieren

env:
  REPO_PATH: /opt/nexifyai/repos/nexify-agentur-plattform
  DOCKER_COMPOSE_FILE: docker-compose.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: SSH Deploy → VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.DEPLOY_KEY_VPS }}
          timeout: 600s
          command_timeout: 30m
          script: |
            set -euo pipefail
            
            echo "🚀 Deployment started at $(date)"
            
            # 1. Repo sync
            cd ${{ env.REPO_PATH }}
            echo "📥 Git fetch + rebase..."
            git fetch origin main
            git reset --hard origin/main
            git pull origin main --ff-only || git rebase origin/main
            
            # 2. Environment check
            echo "🔍 System checks..."
            if ! command -v docker &> /dev/null; then
              echo "❌ Docker not found"
              exit 1
            fi
            if ! command -v docker-compose &> /dev/null; then
              echo "⚠️  docker-compose not found, using 'docker compose'"
              DC="docker compose"
            else
              DC="docker-compose"
            fi
            
            # 3. Build + start
            echo "🔨 Docker build..."
            $DC -f ${{ env.DOCKER_COMPOSE_FILE }} pull 2>&1 || true
            $DC -f ${{ env.DOCKER_COMPOSE_FILE }} up --build -d
            
            # 4. Health check
            echo "🏥 Waiting for services..."
            sleep 10
            
            # Hartes Gate: nur die Website-Health entscheidet über Erfolg dieses Deploys.
            # (Nicht das Vollsystem — Hermes/Paperclip laufen unabhängig und dürfen einen
            # Website-Deploy nicht blockieren.)
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
              echo "✅ Vitrine (port 3000) — OK"
            else
              echo "⚠️  Vitrine (port 3000) — NOT RESPONDING"
            fi
            
            if curl -sf http://127.0.0.1:9621/health > /dev/null 2>&1; then
              echo "✅ LightRAG (port 9621) — OK"
            else
              echo "⚠️  LightRAG (port 9621) — NOT RESPONDING"
            fi

            if curl -sf http://127.0.0.1:8484/health > /dev/null 2>&1; then
              echo "✅ Hermes WebUI (port 8484) — OK"
            else
              echo "⚠️  Hermes WebUI (port 8484) — NOT RESPONDING"
            fi
             
            bash infra/scripts/health-check.sh || true
            
            # 5. Logs
            echo "📋 Recent container logs:"
            $DC -f ${{ env.DOCKER_COMPOSE_FILE }} logs --tail=20
            
            echo "✅ Deployment complete at $(date)"
        continue-on-error: true
      
      - name: §11 Governance Check
        run: |
          echo "📋 Charta §11 Governance-Post-Check..."
          
          # Prüfe Charta-Evidence existiert
          if ls docs/governance/08_evidence/CHARTA_CYCLE*.md 2>/dev/null; then
            echo "✅ Charta-Evidence-Dokumente vorhanden"
          else
            echo "⚠️ Keine Charta-Evidence — Zyklus 1 starten"
          fi
          
          # Prüfe GOVERNANCE.md Port-Matrix
          if grep -q "System-Port-Matrix" docs/governance/GOVERNANCE.md 2>/dev/null; then
            echo "✅ Port-Matrix in GOVERNANCE.md"
          else
            echo "⚠️ Port-Matrix fehlt"
          fi
          
          # Prüfe Cost-Brake
          if grep -q "Task-Abbruch" docs/governance/12_register/FINANCE_COST_VALUE_MARGIN_REGISTER.md 2>/dev/null; then
            echo "✅ Cost-Brake aktiv"
          else
            echo "⚠️ Cost-Brake fehlt"
          fi
          
          # Prüfe §2 Charta-Vollprüfung — Port-Matrix vollständig (§2 VPS-Check)
          for port in 8787 8642 9119 20128 3111 9621 8644; do
            if grep -q ":${port}" docs/governance/GOVERNANCE.md 2>/dev/null; then
              echo "✅ Port ${port} in GOVERNANCE.md Port-Matrix dokumentiert"
            else
              echo "⚠️ Port ${port} fehlt in GOVERNANCE.md Port-Matrix"
            fi
          done
          
          # Prüfe Zyklus-8-Evidence (§2 VPS-Audit nach Merge)
          if ls docs/governance/08_evidence/CHARTA_CYCLE8*.md 2>/dev/null; then
            echo "✅ Zyklus-8-Evidence vorhanden"
          else
            echo "⚠️ Zyklus-8-Evidence fehlt — VPS-Audit nach Merge ausstehend"
          fi
          
          # Prüfe GitHub Actions Schedule (§11)
          if grep -q "0 6 \* \* 1" .github/workflows/test.yml 2>/dev/null; then
            echo "✅ GitHub Actions Schedule 0 6 * * 1 aktiv (§11)"
          else
            echo "⚠️ GitHub Actions Schedule fehlt"
          fi
          
          echo "✅ §11 Governance-Check abgeschlossen"
          
      - name: Deployment Status
        run: |
          echo "Deployment job completed"
          echo "Check VPS: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
