name: Deploy to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: read the repo, write only the container registry (on push).
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # === BUILD & PUSH ===
  # Only the website has a Dockerfile in this repo and a service in docker-compose.yml.
  # Hermes and Paperclip run on the VPS and are managed there directly (see
  # memory/VPS_INFRA.md); they are intentionally not built here.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Registry login is only needed to push, which only happens on main.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push website
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.website
          # On PRs: build only (validates the image), never push.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/nexify-website:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # === DEPLOY TO VPS (nur bei main-merge) ===
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/nexifyai-cloud
            git fetch origin main
            git checkout main
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            # Hartes Gate: nur die Website-Health entscheidet über Erfolg dieses Deploys.
            # (Nicht das Vollsystem — Hermes/Paperclip laufen unabhängig und dürfen einen
            # Website-Deploy nicht blockieren.)
            echo "Warte auf Website-Health..."
            for i in $(seq 1 10); do
              if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then echo "healthy"; break; fi
              if [ "$i" = "10" ]; then echo "FEHLER: Website nicht healthy — Deploy abgebrochen." >&2; exit 1; fi
              sleep 3
            done
            bash infra/scripts/health-check.sh || true
