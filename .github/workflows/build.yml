# FILE: .github/workflows/build.yml
# NIR: 24.07.2026 13:05
# NAME: NeXifyAI Agent (Build & Registry)
# TEAM: NeXifyAI DevOps
# WHAT: Docker image build + push zu GHCR (GitHub Container Registry)
# WHY: Zentrales Image-Repo, SBOM + provenance für Security
# DEPENDS: Docker, GHCR token (auto via GITHUB_TOKEN)
# DOCS-REF: docs/architecture/HERMES-GITHUB-WORKFLOW.md

name: Build & Push Images (GHCR)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/**'
      - 'backend/**'
      - 'deploy/docker/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/**'
      - 'backend/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository_owner }}/nexify-agentur-plattform

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    name: Build Docker Images
    strategy:
      matrix:
        include:
          - name: vitrine
            context: ./apps/website
            dockerfile: ./deploy/docker/Dockerfile.vitrine
            tag: vitrine
          - name: konsole
            context: ./apps/konsole
            dockerfile: ./deploy/docker/Dockerfile.konsole
            tag: konsole
          - name: backend
            context: ./backend
            dockerfile: ./deploy/docker/Dockerfile.backend
            tag: backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:${{ matrix.tag }}-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
        continue-on-error: true
