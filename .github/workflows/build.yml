# FILE: .github/workflows/build.yml
# NIR: 24.07.2026 13:05
# UPDATED: 02.08.2026 08:55
# NAME: NeXifyAI Agent (Build & Registry)
# TEAM: NeXifyAI DevOps
# WHAT: Docker image build + push zu GHCR (GitHub Container Registry)
# WHY: Zentrales Image-Repo, SBOM + provenance für Security
# DEPENDS: Docker, GHCR token (auto via GITHUB_TOKEN)
# DOCS-REF: docs/architecture/HERMES-GITHUB-WORKFLOW.md

name: Build & Push Images (GHCR)

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - 'backend/**'
      - 'deploy/docker/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/**'
      - 'backend/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Berlin
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository_owner }}/nexify-agentur-plattform

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    name: Build Docker Images
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: website
            # Dockerfile.website copies `apps/website/*`, so repo-root context is required.
            context: .
            dockerfile: ./deploy/docker/Dockerfile.website
            tag: website
          - name: hermes
            context: ./apps/hermes
            dockerfile: ./apps/hermes/Dockerfile
            tag: hermes
          - name: backend
            context: ./backend
            dockerfile: ./deploy/docker/Dockerfile.backend
            tag: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:${{ matrix.tag }}-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
        continue-on-error: true
