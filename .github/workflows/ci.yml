name: CI — Test & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

env:
  LANG: de_DE.UTF-8
  LC_ALL: C.UTF-8

jobs:
  # === BACKEND: Python lint + test ===
  backend:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install lint and test tools
        run: pip install flake8==7.3.0 pytest==9.1.1 pytest-xdist==3.8.0

      - name: Lint (critical errors only)
        run: python -m flake8 . --select=E9,F63,F7,F82 --show-source --statistics

      - name: Syntax check portal
        run: python -c "import ast; ast.parse(open('portal/server.py').read())"

      - name: Syntax check server
        run: python -c "import ast; ast.parse(open('server.py').read())"

      - name: Unit tests (offline, fail-hard)
        run: python -m pytest tests/unit -m unit --tb=short

      - name: Integration tests (remote env, gated)
        run: python -m pytest tests/ --ignore=tests/unit -x --tb=short
        continue-on-error: true  # Needs REACT_APP_BACKEND_URL / live DB — see issue #167

  # === FRONTEND: Next.js build validation ===
  website:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/website/pnpm-lock.yaml

      - run: pnpm --dir apps/website install --no-frozen-lockfile

      - name: TypeScript check
        run: pnpm --dir apps/website typecheck

      - name: Lint
        run: pnpm --dir apps/website lint

      - name: Unit tests (*.test.mjs contract runner)
        run: pnpm --dir apps/website test

      - name: Build Next.js
        run: pnpm --dir apps/website build

  # === HERMES: Python app lint + test ===
  hermes:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    defaults:
      run:
        working-directory: apps/hermes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "pyyaml>=6.0" pytest==8.3.5 pytest-timeout==0.5.3 pytest-asyncio==0.24.0 mcp || pip install "pyyaml>=6.0" pytest pytest-timeout pytest-asyncio

      - name: Lint (critical errors only)
        run: python -m flake8 . --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv
        continue-on-error: true

      - name: Syntax check server
        run: python -c "import ast; ast.parse(open('server.py').read())"

      - name: Run tests
        run: python -m pytest tests/ -x --tb=short --timeout=60
        continue-on-error: true  # Tests benötigen laufenden Hermes-Agent — Struktur+Import wird aber validiert

  # === SECURITY: Secret scanning ===
  secret-scan:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@a7082b69f5bc6167bbe27ebab82bf6707f267bf6
        with:
          path: ./
          extra_args: --debug --only-verified

  # === AGENTIC: SOLL deviation + knowledge mandate ===
  agentic-governance:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: SOLL deviation scan
        run: python3 scripts/soll-deviation-scan.py

      - name: Knowledge mandate check
        run: python3 scripts/check_knowledge_mandate.py
