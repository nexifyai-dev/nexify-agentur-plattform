# FILE: .github/workflows/codeql.yml
# NIR: 02.08.2026 09:05
# UPDATED: 02.08.2026 10:00
# NAME: NeXifyAI Agent
# TEAM: NeXifyAI DevOps
# WHAT: GitHub CodeQL analysis for JavaScript/TypeScript and Python.
# WHY: Issue #134 — Code Scanning + Ruleset-compatible check names.
# BEST-PRACTICE: Official github/codeql-action; paths-ignore vendored Hermes.
# PITFALL: V-SEC-01: Do not upload SARIF from untrusted forks without permissions guard.
# DEPENDS: GitHub Advanced Security / Code Scanning enabled on repo
# DOCS-REF: https://docs.github.com/en/code-security/code-scanning
# SESSION: security-policy-7dd5

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          category: "/language:${{ matrix.language }}"
