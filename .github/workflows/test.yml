# FILE: .github/workflows/test.yml
# NIR: 24.07.2026 13:00
# UPDATED: 02.08.2026 08:55
# NAME: NeXifyAI Agent (CI/CD Automation)
# TEAM: NeXifyAI DevOps
# WHAT: Erweiterte Test-Suite — Lint, Unit-Tests, Docker-Build-Verify (feature branches + PRs)
# WHY: Ergänzt ci.yml (main-only): deckt feature-Branches/PRs ab + Docker-Build-Validierung
# BEST-PRACTICE: setup-python@v5; explizite permissions; pnpm per Konvention
# PITFALL: V-01: setup-python@v4 veraltet → schlägt mit 0 Jobs fehl (kein permissions-Block)
#          V-02: docker/build-push-action braucht setup-buildx; cache-from: type=gha optional
# DEPENDS: Node.js 20+, Python 3.11+, pnpm 9, Docker Buildx
# DOCS-REF: docs/architecture/HERMES-GITHUB-WORKFLOW.md

name: Test Suite (Lint, Unit, Docker)

on:
  schedule:
    - cron: '0 6 * * 1'  # §11 Mo 06:00 Charta-Monitoring
  push:
    branches: [ 'feature/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    name: Lint (JavaScript, Python, YAML)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'apps/website/pnpm-lock.yaml'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install JS dependencies
        run: pnpm --dir apps/website install --frozen-lockfile

      - name: Lint JavaScript (ESLint)
        run: pnpm --dir apps/website lint

      - name: Check YAML syntax
        run: |
          pip install yamllint
          yamllint .github/workflows/ docs/governance/ 2>&1 || true
        continue-on-error: true

  unit-test:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    name: Unit Tests (Backend + Frontend)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'apps/website/pnpm-lock.yaml'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install JS dependencies
        run: pnpm --dir apps/website install --frozen-lockfile

      - name: Test JS (Website tests)
        run: pnpm --dir apps/website test

      - name: Backend unit tests (offline, fail-hard)
        run: |
          pip install flake8==7.3.0 pytest==9.1.1 -q
          cd backend && python -m pytest tests/unit -m unit --tb=short

      - name: Backend integration tests (remote env, gated)
        run: |
          cd backend && python -m pytest tests/ --ignore=tests/unit -x --tb=short
        continue-on-error: true

  docker-build-test:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    name: Docker Build (Verify Dockerfiles)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build website image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./deploy/docker/Dockerfile.website
          push: false
        continue-on-error: true

      - name: Build hermes image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./apps/hermes
          file: ./apps/hermes/Dockerfile
          push: false
        continue-on-error: true

      - name: Build backend image
        if: hashFiles('deploy/docker/Dockerfile.backend') != ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./backend
          file: ./deploy/docker/Dockerfile.backend
          push: false
        continue-on-error: true
