# FILE: .github/workflows/test.yml
# NIR: 24.07.2026 13:00
# UPDATED: 27.07.2026 09:40
# NAME: NeXifyAI Agent (CI/CD Automation)
# TEAM: NeXifyAI DevOps
# WHAT: Erweiterte Test-Suite — Lint, Unit-Tests, Docker-Build-Verify (develop + feature branches)
# WHY: Ergänzt ci.yml (main-only): deckt develop/feature-Branches ab + Docker-Build-Validierung
# BEST-PRACTICE: setup-python@v5; explizite permissions; pnpm per Konvention
# PITFALL: V-01: setup-python@v4 veraltet → schlägt mit 0 Jobs fehl (kein permissions-Block)
#          V-02: docker/build-push-action braucht setup-buildx; cache-from: type=gha optional
# DEPENDS: Node.js 20+, Python 3.11+, pnpm 9, Docker Buildx
# DOCS-REF: docs/architecture/HERMES-GITHUB-WORKFLOW.md

name: Test Suite (Lint, Unit, Docker)

on:
  schedule:
    - cron: '0 6 * * 1'  # §11 Mo 06:00 Charta-Monitoring
  push:
    branches: [ develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (JavaScript, Python, YAML)
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'apps/website/pnpm-lock.yaml'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install JS dependencies
        run: pnpm --dir apps/website install --frozen-lockfile

      - name: Lint JavaScript (ESLint)
        run: pnpm --dir apps/website lint

      - name: Check YAML syntax
        run: |
          pip install yamllint
          yamllint .github/workflows/ docs/governance/ 2>&1 || true
        continue-on-error: true

  unit-test:
    runs-on: ubuntu-latest
    name: Unit Tests (Backend + Frontend)
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'apps/website/pnpm-lock.yaml'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install JS dependencies
        run: pnpm --dir apps/website install --frozen-lockfile

      - name: Test JS (Website tests)
        run: pnpm --dir apps/website test

      - name: Backend tests (Python)
        run: |
          if [ -d "./backend" ]; then
            pip install flake8==7.3.0 pytest==9.1.1 -q
            cd backend && python -m pytest tests/ -x --tb=short 2>&1 || true
          fi
        continue-on-error: true

  docker-build-test:
    runs-on: ubuntu-latest
    name: Docker Build (Verify Dockerfiles)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build website image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile.website
          push: false
        continue-on-error: true

      - name: Build hermes image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/hermes
          file: ./apps/hermes/Dockerfile
          push: false
        continue-on-error: true

      - name: Build backend image
        if: hashFiles('deploy/docker/Dockerfile.backend') != ''
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./deploy/docker/Dockerfile.backend
          push: false
        continue-on-error: true
