# VPS Admin — Nginx Reverse-Proxy for Website (Standalone Backup)
# Used when Traefik is temporarily unavailable or for local VPS-only setup
server {
    listen 80;
    server_name nexifyai.cloud www.nexifyai.cloud;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nexifyai.cloud www.nexifyai.cloud;

    ssl_certificate     /etc/letsencrypt/live/nexifyai.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexifyai.cloud/privkey.pem;

    gzip on;
    gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }
}
