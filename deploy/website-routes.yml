# NeXify AI Website — Traefik Route
http:
  routers:
    nexifyai-cloud:
      rule: "Host(`nexifyai.cloud`) || Host(`www.nexifyai.cloud`)"
      entryPoints:
        - websecure
      priority: 15
      middlewares:
        - website-secHeaders
        - website-rateLimit
      service: nexifyai-website
      tls:
        certResolver: letsencrypt
  services:
    nexifyai-website:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:3000"
        passHostHeader: true
        healthCheck:
          path: /api/health
          interval: 30s
          timeout: 5s
