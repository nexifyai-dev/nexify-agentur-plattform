schema: "paperclip/v1"
agents:
  nexify-ai-ceo:
    role: "ceo"
    adapter:
      config:
        effort: "high"
        graceSec: 15
        hermesCommand: "hermes"
        timeoutSec: 600
      type: "hermes_local"
    runtime:
      heartbeat:
        enabled: true
        intervalSec: 300
    permissions:
      authorizationPolicy:
        reviewPreset:
          version: 1
          id: "low_trust_review"
          rawOutputDisposition: "quarantine"
        trustPreset: "low_trust_review"
      canAssignTasks: true
      canCreateAgents: true
      trustPreset: "standard"
    inputs:
      env:
        PAPERCLIP_API_KEY:
          description: "Optional default for PAPERCLIP_API_KEY on agent nexify-ai-ceo"
          kind: "secret"
          default: ""
          requirement: "optional"
        PAPERCLIP_API_URL:
          description: "Optional default for PAPERCLIP_API_URL on agent nexify-ai-ceo"
          kind: "plain"
          default: "http://127.0.0.1:3100/api"
          requirement: "optional"
  nexify-ai-developer:
    role: "general"
    adapter:
      config:
        effort: "high"
        extraArgs:
          - "--yolo"
        graceSec: 15
        hermesCommand: "nexifyai"
        paperclipApiUrl: "http://127.0.0.1:3100/api"
        persistSession: true
        quiet: true
        timeoutSec: 300
      type: "hermes_local"
    runtime:
      heartbeat:
        enabled: true
    permissions:
      canAssignTasks: true
      canCreateAgents: true
    inputs:
      env:
        PAPERCLIP_API_KEY:
          description: "Optional default for PAPERCLIP_API_KEY on agent nexify-ai-developer"
          kind: "secret"
          default: ""
          requirement: "optional"
        PAPERCLIP_API_URL:
          description: "Optional default for PAPERCLIP_API_URL on agent nexify-ai-developer"
          kind: "plain"
          default: "http://127.0.0.1:3100/api"
          requirement: "optional"
  nexify-analyst:
    role: "general"
    adapter:
      config:
        extraArgs:
          - "--yolo"
        graceSec: 15
        paperclipApiUrl: "http://127.0.0.1:3100/api"
        persistSession: true
        quiet: true
        timeoutSec: 0
      type: "hermes_local"
    inputs:
      env:
        PAPERCLIP_API_KEY:
          description: "Optional default for PAPERCLIP_API_KEY on agent nexify-analyst"
          kind: "secret"
          default: ""
          requirement: "optional"
        PAPERCLIP_API_URL:
          description: "Optional default for PAPERCLIP_API_URL on agent nexify-analyst"
          kind: "plain"
          default: "http://127.0.0.1:3100/api"
          requirement: "optional"
  nexify-architekt:
    role: "general"
    adapter:
      config:
        extraArgs:
          - "--yolo"
        graceSec: 15
        paperclipApiUrl: "http://127.0.0.1:3100/api"
        persistSession: true
        quiet: true
        timeoutSec: 0
      type: "hermes_local"
    inputs:
      env:
        PAPERCLIP_API_KEY:
          description: "Optional default for PAPERCLIP_API_KEY on agent nexify-architekt"
          kind: "secret"
          default: ""
          requirement: "optional"
        PAPERCLIP_API_URL:
          description: "Optional default for PAPERCLIP_API_URL on agent nexify-architekt"
          kind: "plain"
          default: "http://127.0.0.1:3100/api"
          requirement: "optional"
  nexify-ops:
    role: "general"
    adapter:
      config:
        extraArgs:
          - "--yolo"
        graceSec: 15
        paperclipApiUrl: "http://127.0.0.1:3100/api"
        persistSession: true
        quiet: true
        timeoutSec: 0
      type: "hermes_local"
    inputs:
      env:
        PAPERCLIP_API_KEY:
          description: "Optional default for PAPERCLIP_API_KEY on agent nexify-ops"
          kind: "secret"
          default: ""
          requirement: "optional"
        PAPERCLIP_API_URL:
          description: "Optional default for PAPERCLIP_API_URL on agent nexify-ops"
          kind: "plain"
          default: "http://127.0.0.1:3100/api"
          requirement: "optional"
  nexify-qa:
    role: "general"
    adapter:
      config:
        extraArgs:
          - "--yolo"
        graceSec: 15
        paperclipApiUrl: "http://127.0.0.1:3100/api"
        persistSession: true
        quiet: true
        timeoutSec: 0
      type: "hermes_local"
    inputs:
      env:
        PAPERCLIP_API_KEY:
          description: "Optional default for PAPERCLIP_API_KEY on agent nexify-qa"
          kind: "secret"
