# Nexify Agentur Plattform Workflow Ecc Bundle Integration

## Action

Follow the ecc-bundle-integration workflow:
1. Add or update .claude/ecc-tools.json
2. Add or update .claude/identity.json
3. Add or update .claude/skills/[skill-name]/SKILL.md
4. Add or update .claude/homunculus/instincts/inherited/[skill-name]-instincts.yaml
5. Add or update .claude/commands/project-snapshot-or-cleanup.md
6. Add or update .agents/skills/[skill-name]/SKILL.md
7. Add or update .agents/skills/[skill-name]/agents/openai.yaml (Agents Skills metadata; not OpenAI Codex)
8. Do not recreate .codex/ — OpenAI Codex retired 2026-08-02; Cursor Agent only

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: .claude/ecc-tools.json, .claude/identity.json, .claude/skills/*/SKILL.md

