services:
  website:
    # CI (deploy-vps.yml) builds and pushes this exact tag; `docker compose pull`
    # on the VPS pulls it. `build:` stays as a local-dev / fallback path so
    # `docker compose up --build` still works without the registry.
    image: ghcr.io/nexifyai-dev/nexify-website:latest
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.website
    container_name: nexify-website
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
