services:
  website:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.website
    container_name: nexify-website
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
