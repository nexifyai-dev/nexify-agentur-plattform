# NeXify AI — Docker Compose (VPS Production)
# Start: docker compose up -d --build
# Status: docker compose ps

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-certs:/certs
    networks:
      - web
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  website:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.website
    container_name: nexify-website
    restart: unless-stopped
    env_file:
      - ./infra/.env.vps
    networks:
      - web
    depends_on:
      traefik:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  hermes-webui:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.hermes
    container_name: nexify-hermes
    restart: unless-stopped
    env_file:
      - ./infra/.env.vps
    volumes:
      - hermes-data:/data/hermes
    networks:
      - web
    depends_on:
      traefik:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  paperclip:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.paperclip
    container_name: nexify-paperclip
    restart: unless-stopped
    env_file:
      - ./infra/.env.vps
    volumes:
      - paperclip-data:/data/paperclip
    networks:
      - web
    depends_on:
      traefik:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  traefik-certs:
  hermes-data:
  paperclip-data:

networks:
  web:
    driver: bridge
