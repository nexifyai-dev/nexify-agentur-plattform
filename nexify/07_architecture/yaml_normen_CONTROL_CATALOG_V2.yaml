# NeXify AI — Control Catalog V2
> Version: 2.0 | Stand: 23.06.2026
> Erweitert: Webdesign, AI-Agenten, Content, Betrieb
> Normen + Gesetze + Standards + Verbote
> Gesamt: 66 Controls

controls:
  WD-01:
    origin: "DIN EN ISO 9241-210"
    title: "Human-Centred Design-Prozess"
    description: "HCD-Prozess dokumentiert und angewandt"
    test: "HCD-Plan existiert, Phasen durchlaufen"
    frequency: pro Projekt
    owner: UX Lead
  WD-02:
    origin: "DIN EN ISO 9241-11"
    title: "Gebrauchstauglichkeitstest"
    description: "Usability-Test mit ≥5 Nutzern"
    test: "Testbericht, Effektivität/Effizienz/Zufriedenheit gemessen"
    frequency: pro Release
    owner: UX Lead
  WD-03:
    origin: "DIN EN ISO 9241-110"
    title: "Dialogprinzipien"
    description: "Aufgabenangemessenheit, Selbstbeschreibungsfähigkeit, Steuerbarkeit, Erwartungskonformität, Fehlertoleranz, Individualisierbarkeit, Lernförderlichkeit geprüft"
    test: "Prüfmatrix existiert"
    frequency: pro UI-Komponente
    owner: UX Lead
  WD-04:
    origin: "EN 301 549"
    title: "ICT-Barrierefreiheit"
    description: "Tastaturbedienung, Screenreader, Kontraste, Alternativtexte, Untertitel, Gebärde"
    test: "WCAG 2.2 AA Check durchlaufen"
    frequency: pro Release
    owner: UX Lead
  WD-05:
    origin: "WCAG 2.2 AA"
    title: "Barrierefreie Webinhalte"
    description: "Perceivable, Operable, Understandable, Robust (POUR)"
    test: "Automatisierter + manueller WCAG-Test"
    frequency: pro Release
    owner: UX Lead
  WD-06:
    origin: "BFSG/EAA"
    title: "Barrierefreiheitsstärkungsgesetz"
    description: "Websites, Apps, E-Books, Banking-Services ab 28.06.2025 barrierefrei"
    test: "Konformitätserklärung, Barrierefreiheitserklärung auf Website"
    frequency: jährlich
    owner: CEO
  WD-07:
    origin: "DIN EN ISO 9241-143"
    title: "Formulargestaltung"
    description: "Eingabehilfen, Validierung, Fehlermeldungen, Navigation, Tab-Reihenfolge"
    test: "Formular-Audit"
    frequency: pro Formular
    owner: UX Lead
  WD-08:
    origin: "DIN EN ISO 9241-125"
    title: "Visuelle Informationsdarstellung"
    description: "Farben, Schriftgrößen, Symbole, Diagramme konsistent"
    test: "Design-System-Prüfung"
    frequency: pro Release
    owner: UX Lead
  AA-01:
    origin: "ISO 22989"
    title: "KI-Begriffe und Rollen"
    description: "Agenten-Rollenmodell: Entwickler, Betreiber, Nutzer, Betroffene definiert"
    test: "Rollenmatrix existiert"
    frequency: einmalig + bei neuem Agenten
    owner: CEO
  AA-02:
    origin: "ISO 23053"
    title: "KI-System-Framework"
    description: "KI-System-Architektur dokumentiert (Modell, Daten, Entscheidung, Aktion)"
    test: "Architekturdiagramm + Beschreibung"
    frequency: einmalig
    owner: CTO
  AA-03:
    origin: "EU AI Act"
    title: "Risikoklassifizierung"
    description: "Jeder Agent nach EU AI Act Art. 5-6 klassifiziert (Minimal/Hoch) und mit Anforderungskatalog"
    test: "Klassifizierungsmatrix, Risiko-Dokument"
    frequency: pro Agent
    owner: CISO
  AA-04:
    origin: "OWASP LLM Top 10"
    title: "Prompt-Injection-Schutz"
    description: "Input-Validierung, Output-Filter, System-Prompt-Sicherung"
    test: "Pen-Test: Prompt-Injection-Versuche"
    frequency: monatlich
    owner: CISO
  AA-05:
    origin: "OWASP Agentic Top 10"
    title: "Agenten-Aktionssicherheit"
    description: "Tool-Rechte-Matrix, Autonomie-Level, Kill Switch, Approval-Gates"
    test: "Agenten-Audit"
    frequency: monatlich
    owner: CISO
  AA-06:
    origin: "ISO 24027"
    title: "Bias-Prüfung"
    description: "Regelmäßige Bias-Tests: Datensatz, Prompt, Output"
    test: "Bias-Testbericht"
    frequency: quartalsweise
    owner: CTO
  AA-07:
    origin: "ISO 24028"
    title: "Trustworthiness"
    description: "Robustheit, Erklärbarkeit, Zuverlässigkeit, Resilienz geprüft"
    test: "Trustworthiness-Checkliste"
    frequency: quartalsweise
    owner: CTO
  CT-01:
    origin: "DIN 5008"
    title: "Schreib-/Gestaltungsregeln"
    description: "Korrekte Anschrift, Betreff, Anrede, Struktur, Abkürzungen, Zahlenformate"
    test: "DIN-5008-Check durchlaufen"
    frequency: pro Dokument
    owner: COO
  CT-02:
    origin: "DIN 676"
    title: "Geschäftsbrief-Vorlage"
    description: "Einheitliche Briefvorlage mit Absender, Empfänger, Betreff, Datum, Anlagen"
    test: "Vorlage existiert, wird genutzt"
    frequency: einmalig
    owner: COO
  CT-03:
    origin: "ISO 24495-1"
    title: "Verständliche Sprache"
    description: "Plain Language: kurze Sätze, aktive Verben, logische Struktur"
    test: "Language Score >70 (z.B. TextLab, Hohenheim)"
    frequency: Pro Landingpage/Doku
    owner: COO
  CT-04:
    origin: "UWG"
    title: "Keine irreführende Werbung"
    description: "Keine falschen Claims, keine KI-Inhalte als menschlich deklarieren"
    test: "UWG-Prüfung"
    frequency: pro Landingpage/Angebot
    owner: CEO
  CT-05:
    origin: "EU AI Act Transparenz"
    title: "KI-Kennzeichnung"
    description: "KI-generierte Inhalte eindeutig gekennzeichnet (Art. 50)"
    test: "Kennzeichnung sichtbar"
    frequency: einmalig + bei KI-Inhalt
    owner: COO
  OP-02:
    origin: "ISO 27031"
    title: "ICT Readiness"
    description: "IT-Notfallvorsorge getestet (Strom, Netzwerk, Cloudflare-Ausfall)"
    test: "Testprotokoll"
    frequency: jährlich
    owner: CTO
  OP-03:
    origin: "OWASP Web"
    title: "API-Sicherheits-Gates"
    description: "Rate-Limiting, Input-Validierung, Auth-Prüfung, CORS"
    test: "Security-Scan (zsh/trivy)"
    frequency: pro Deployment
    owner: CTO
  OP-04:
    origin: "NIS-2"
    title: "Security-Meldepflicht"
    description: "Schwere Incidents innerhalb 24h an BSI melden (ab 17.10.2024)"
    test: "Incident-Prozess NIS-2-konform"
    frequency: vor Inkrafttreten
    owner: CEO
  OP-05:
    origin: "CIS Controls V8"
    title: "Safeguards (18 Bereiche)"
    description: "CIS IG1 erfüllt (Basis-Kontrollen)"
    test: "CIS-Benchmark-Scan"
    frequency: einmalig
    owner: CTO
  PM-01:
    origin: "DIN 69901-5"
    title: "Projektphasen"
    description: "Init, Plan, Execute, Monitor, Close dokumentiert"
    test: "Projektphasen-Checkliste"
    frequency: pro Projekt
    owner: COO
  PM-02:
    origin: "ISO 9001 A.10"
    title: "Korrekturmaßnahmen (CAPA)"
    description: "Alle Abweichungen dokumentiert, Ursachen analysiert, Maßnahmen getroffen"
    test: "CAPA-Log = geschlossene Tickets"
    frequency: laufend
    owner: COO
  # === ISO 27001 ===
  AC-01: {origin: "ISO 27001 A.5", title: "IS-Policy", description: "Dokumentierte IS-Policy, jährlich reviewed", test: "Policy existiert", frequency: jährlich, owner: CEO}
  AC-02: {origin: "ISO 27001 A.5", title: "IS-Rollen", description: "CISO benannt", test: "CISO benannt", frequency: jährlich, owner: CEO}
  AM-01: {origin: "ISO 27001 A.8", title: "Asset-Inventar", description: "Alle IT-Assets", test: "Liste vollständig", frequency: monatlich, owner: CTO}
  AC-03: {origin: "ISO 27001 A.9", title: "Zugriffskontrolle", description: "RBAC, Least-Privilege", test: "Matrix reviewed", frequency: quartalsweise, owner: CTO}
  CR-01: {origin: "ISO 27001 A.10", title: "Kryptographie", description: "AES-256, TLS 1.3", test: "TLS gültig", frequency: monatlich, owner: CTO}
  OP-01: {origin: "ISO 27001 A.12", title: "Betriebssicherheit", description: "Runbooks, Changes", test: "Changes logged", frequency: laufend, owner: COO}
  BC-01: {origin: "ISO 27001 A.12", title: "Backup/Recovery", description: "Täglich Backup, mtl. Restore", test: "Restore erfolgreich", frequency: monatlich, owner: COO}
  NW-01: {origin: "ISO 27001 A.13", title: "Netzwerksicherheit", description: "WAF, Segmentierung", test: "WAF aktiv", frequency: quartalsweise, owner: CTO}
  TR-01: {origin: "ISO 27001 A.14", title: "Lieferanten-Prüfung", description: "AVV, Bewertung", test: "AVV existieren", frequency: jährlich, owner: CEO}
  INC-01: {origin: "ISO 27001 A.16", title: "Incident-Management", description: "Incident-Prozess", test: "Runbook + Übung", frequency: quartalsweise, owner: CTO}
  BC-02: {origin: "ISO 27001 A.17", title: "BCM", description: "RTO/RPO, Übung", test: "Plan + Übung", frequency: jährlich, owner: CEO}
  CP-01: {origin: "ISO 27001 A.18", title: "Compliance-Prüfung", description: "Rechtliche Prüfung", test: "Checkliste", frequency: monatlich, owner: CEO}
  # === ISO 42001 ===
  AI-01: {origin: "ISO 42001 A.2", title: "AI-Inventar", description: "Alle Agenten dokumentiert", test: "Inventar vollständig", frequency: monatlich, owner: CTO}
  AI-02: {origin: "ISO 42001 A.3", title: "AI-Risiko", description: "Klassifizierung aller Systeme", test: "Matrix existiert", frequency: quartalsweise, owner: CISO}
  AI-03: {origin: "ISO 42001 A.4", title: "Human Oversight", description: "HITL/HOTL", test: "Aktionsmatrix", frequency: monatlich, owner: CEO}
  AI-04: {origin: "ISO 42001 A.5", title: "Transparenz", description: "AI-Hinweise", test: "Hinweis aktiv", frequency: einmalig, owner: CPO}
  AI-05: {origin: "ISO 42001 A.6", title: "Datenqualität", description: "Bias-Prüfung", test: "Qualitätscheck", frequency: monatlich, owner: CTO}
  AI-06: {origin: "ISO 42001 A.7", title: "Modell-Monitoring", description: "Drift, Latenz", test: "Dashboard aktiv", frequency: täglich, owner: CTO}
  AI-07: {origin: "ISO 42001 A.8", title: "Agenten-Sperren", description: "Kritische Aktionen blockiert", test: "Sperren aktiv", frequency: monatlich, owner: CISO}
  AI-08: {origin: "ISO 42001 A.9", title: "Bias/Robustheit", description: "Bias + Red-Team", test: "Testbericht", frequency: quartalsweise, owner: CISO}
  AI-09: {origin: "ISO 42001 A.10", title: "AI-Logging", description: "Prompts/Outputs", test: "Logging 90d", frequency: laufend, owner: COO}
  # === VERBOTE ===
  RB-01: {origin: "V01", title: "Keine Secrets in Repos", description: "Nie in Git", test: "Pre-Commit", frequency: pro Commit, owner: CTO}
  RB-02: {origin: "V02", title: "Kein Rollback-freies Deploy", description: "Deployment braucht Rollback-Plan", test: "Plan exists", frequency: pro Deploy, owner: CTO}
  RB-03: {origin: "V03", title: "Keine PII an Modelle", description: "Keine Kundendaten ohne Freigabe", test: "Filter aktiv", frequency: laufend, owner: CISO}
  RB-04: {origin: "V04", title: "Kein Merge ohne Review", description: "Main per PR", test: "Branch Protection", frequency: pro PR, owner: CTO}
  RB-05: {origin: "V05", title: "Kein Service ohne Healthcheck", description: "/health verpflichtend", test: "Endpoint existiert", frequency: einmalig, owner: COO}
  RB-06: {origin: "V06", title: "Keine Tenant-Vermischung", description: "Kunden isoliert", test: "Workspace geprüft", frequency: pro Projekt, owner: CEO}
  RB-07: {origin: "V07", title: "Kein Done ohne Evidence", description: "Dateien + Tests nötig", test: "DoD-Check", frequency: pro Task, owner: QA}
  RB-08: {origin: "V08", title: "Keine Secrets in Brain", description: "Brain/Logs secret-frei", test: "Scan", frequency: laufend, owner: CISO}
