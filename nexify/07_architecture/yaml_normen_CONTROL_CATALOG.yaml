# NeXify AI — Control Catalog (maschinenlesbar)
# Version: 1.0 | Stand: 23.06.2026
# Controls aus: ISO 27001, ISO 42001, ISO 27701, ISO 9001, ISO 20000, ISO 22301, Verbote
# Gesamt: 46 Controls

controls:
  AC-01:
    origin: "ISO 27001 A.5"
    title: "Informationssicherheits-Policy"
    description: "Dokumentierte IS-Policy, jährlich reviewed"
    test: "Policy existiert, Review-Datum < 1 Jahr"
    frequency: jährlich
    owner: CEO
  AC-02:
    origin: "ISO 27001 A.5"
    title: "Informationssicherheits-Rollen"
    description: "CISO benannt, Verantwortlichkeiten definiert"
    test: "CISO benannt, Job Description existiert"
    frequency: jährlich
    owner: CEO
  AM-01:
    origin: "ISO 27001 A.8"
    title: "Asset-Inventar"
    description: "Vollständiges Inventar aller IT-Assets (Systeme, Dienste, Daten)"
    test: "Asset-Liste existiert, Vollständigkeitsprüfung"
    frequency: monatlich
    owner: CTO
  AC-03:
    origin: "ISO 27001 A.9"
    title: "Zugriffskontrolle"
    description: "Rollenbasierte Zugriffsmatrix, Least-Privilege-Prinzip"
    test: "Zugriffsmatrix existiert, regelmäßige Review"
    frequency: quartalsweise
    owner: CTO
  IAM-01:
    origin: "ISO 27001 A.9"
    title: "Identity & Access Management"
    description: "User-Provisioning, -Deprovisioning, MFA"
    test: "MFA aktiv, Deprovisioning-Prozess dokumentiert"
    frequency: quartalsweise
    owner: CTO
  CR-01:
    origin: "ISO 27001 A.10"
    title: "Kryptographie-Policy"
    description: "Verschlüsselung: Ruhend (AES-256), Transport (TLS 1.3)"
    test: "TLS 1.3 Zertifikate gültig, keine unsicheren Cipher"
    frequency: monatlich
    owner: CTO
  PH-01:
    origin: "ISO 27001 A.11"
    title: "Physische Sicherheit"
    description: "VPS-RZ-Sicherheit durch Hetzner, keine physischen Assets"
    test: "Hetzner SOC2/ISO 27001 Zertifikat geprüft"
    frequency: jährlich
    owner: CEO
  OP-01:
    origin: "ISO 27001 A.12"
    title: "Betriebssicherheit"
    description: "Dokumentierte Betriebsprozesse, Change-Management"
    test: "Runbooks existieren, Changes dokumentiert"
    frequency: laufend
    owner: COO
  AV-01:
    origin: "ISO 27001 A.12"
    title: "Malware-Schutz"
    description: "Systeme gehärtet, keine AV auf VPS (Container-Isolation)"
    test: "Docker-Security-Scans, Trivy weekly"
    frequency: wöchentlich
    owner: CTO
  BC-01:
    origin: "ISO 27001 A.12"
    title: "Backup & Recovery"
    description: "Tägliches Backup, monatlicher Restore-Test"
    test: "Letzter Restore-Test erfolgreich"
    frequency: monatlich
    owner: COO
  NW-01:
    origin: "ISO 27001 A.13"
    title: "Netzwerksicherheit"
    description: "Segmentierung, Firewalls, Cloudflare WAF"
    test: "WAF aktiv, Segmentierung dokumentiert"
    frequency: quartalsweise
    owner: CTO
  TR-01:
    origin: "ISO 27001 A.14"
    title: "Lieferanten-Sicherheit"
    description: "Lieferantenbewertung, AVV mit Cloudflare/Vercel/GitHub/Hetzner"
    test: "AVV existieren, Lieferanten jährlich bewertet"
    frequency: jährlich
    owner: CEO
  INC-01:
    origin: "ISO 27001 A.16"
    title: "Incident-Management"
    description: "Dokumentierter Incident-Prozess, Meldepflichten"
    test: "Incident-Runbook existiert, letzte Übung"
    frequency: quartalsweise
    owner: CTO
  BC-02:
    origin: "ISO 27001 A.17"
    title: "Business Continuity"
    description: "BCM-Plan, RTO/RPO definiert, jährliche Übung"
    test: "BCM-Plan existiert, Übung durchgeführt"
    frequency: jährlich
    owner: CEO
  CP-01:
    origin: "ISO 27001 A.18"
    title: "Compliance-Prüfung"
    description: "Regelmäßige Prüfung auf Einhaltung rechtlicher/regulatorischer Anforderungen"
    test: "Compliance-Checkliste monatlich geprüft"
    frequency: monatlich
    owner: CEO
  AI-01:
    origin: "ISO 42001 A.2"
    title: "AI-Systeminventar"
    description: "Alle AI-Systeme (Agenten, Modelle, 9Router-Routen) dokumentiert"
    test: "Inventar existiert, vollständig"
    frequency: monatlich
    owner: CTO
  AI-02:
    origin: "ISO 42001 A.3"
    title: "AI-Risikoklassifizierung"
    description: "Jedes AI-System nach Risiko (hoch/mittel/niedrig) klassifiziert"
    test: "Klassifizierungsmatrix existiert"
    frequency: quartalsweise
    owner: CISO
  AI-03:
    origin: "ISO 42001 A.4"
    title: "Human Oversight"
    description: "Autonome Agenten brauchen Human-in-the-Loop für kritische Aktionen"
    test: "Aktionsmatrix existiert, Freigaben dokumentiert"
    frequency: monatlich
    owner: CEO
  AI-04:
    origin: "ISO 42001 A.5"
    title: "Transparenz & Hinweise"
    description: "Kunden/User erhalten Hinweis auf AI-Nutzung"
    test: "Hinweis in WebUI/Agenten-Interaktion implementiert"
    frequency: einmalig + bei Änderung
    owner: CPO
  AI-05:
    origin: "ISO 42001 A.6"
    title: "Datenqualität"
    description: "Trainings-/Prompt-Daten auf Bias, Vollständigkeit, Aktualität geprüft"
    test: "Datenqualitäts-Check in Pipeline"
    frequency: monatlich
    owner: CTO
  AI-06:
    origin: "ISO 42001 A.7"
    title: "Modell-Monitoring"
    description: "Modell-Performance, Drift, Halluzinationen, Latenz überwacht"
    test: "Monitoring-Dashboard aktiv, Alarme konfiguriert"
    frequency: täglich
    owner: CTO
  AI-07:
    origin: "ISO 42001 A.8"
    title: "Agenten-Aktionssperren"
    description: "Kritische Aktionen (Deployment, Secrets, Delete) gesperrt ohne Freigabe"
    test: "Sperrregeln implementiert, getestet"
    frequency: monatlich
    owner: CISO
  AI-08:
    origin: "ISO 42001 A.9"
    title: "Bias & Robustheit"
    description: "Regelmäßige Bias-Prüfung, Red-Teaming für Agenten"
    test: "Letzter Bias-Test dokumentiert"
    frequency: quartalsweise
    owner: CISO
  AI-09:
    origin: "ISO 42001 A.10"
    title: "AI-Logging"
    description: "Prompts, Responses, Entscheidungen, Fehler geloggt (nicht PII)"
    test: "Logging aktiv, Retention 90 Tage"
    frequency: laufend
    owner: COO
  DP-01:
    origin: "ISO 27701 A.7"
    title: "DSGVO-Verzeichnis"
    description: "Verarbeitungstätigkeiten dokumentiert (Art. 30)"
    test: "Verzeichnis existiert, vollständig"
    frequency: jährlich
    owner: CEO
  DP-02:
    origin: "ISO 27701 A.7"
    title: "AVV-Matrix"
    description: "Alle Auftragsverarbeiter mit AVV dokumentiert"
    test: "AVV mit Cloudflare/Vercel/GitHub/Hetzner/DeepSeek vorhanden"
    frequency: jährlich
    owner: CEO
  DP-03:
    origin: "ISO 27701 A.8"
    title: "Betroffenenrechte"
    description: "Prozess für Auskunft/Löschung/Berichtigung/Datenportabilität"
    test: "Prozess dokumentiert, getestet"
    frequency: quartalsweise
    owner: CEO
  DP-04:
    origin: "ISO 27701 A.9"
    title: "Löschkonzept"
    description: "Löschfristen definiert, automatisiert"
    test: "Löschscript existiert, getestet"
    frequency: monatlich
    owner: COO
  DP-05:
    origin: "ISO 27701 A.10"
    title: "Datenschutz-Folgenabschätzung"
    description: "DPA für risikoreiche Verarbeitungen durchgeführt"
    test: "DPA-Dokumente existieren"
    frequency: vor neuer Verarbeitung
    owner: CEO
  QM-01:
    origin: "ISO 9001 A.4"
    title: "Qualitätspolitik"
    description: "Dokumentierte Qualitätspolitik, kommuniziert"
    test: "Politik existiert, allen Mitarbeitern bekannt"
    frequency: jährlich
    owner: CEO
  QM-02:
    origin: "ISO 9001 A.7"
    title: "Kundenkommunikation"
    description: "Angebote, Aufträge, Feedback, Beschwerden dokumentiert"
    test: "Prozesse definiert, CRM genutzt"
    frequency: laufend
    owner: COO
  QM-03:
    origin: "ISO 9001 A.8"
    title: "Prozessdokumentation"
    description: "Alle Kernprozesse dokumentiert, aktuell"
    test: "Prozesslandkarte existiert"
    frequency: jährlich
    owner: COO
  QM-04:
    origin: "ISO 9001 A.9"
    title: "Interne Audits"
    description: "Jährliches internes Audit geplant/durchgeführt"
    test: "Auditplan existiert, letztes Audit dokumentiert"
    frequency: jährlich
    owner: CEO
  QM-05:
    origin: "ISO 9001 A.10"
    title: "Korrekturmaßnahmen"
    description: "Abweichungen dokumentiert, Ursachen analysiert, Maßnahmen getroffen"
    test: "CAPA-Log existiert"
    frequency: laufend
    owner: COO
  SV-01:
    origin: "ISO 20000-1 A.6"
    title: "Service-Level-Management"
    description: "SLA für work.nexifyai.cloud (Verfügbarkeit, Performance)"
    test: "SLA dokumentiert, eingehalten"
    frequency: monatlich
    owner: COO
  SV-02:
    origin: "ISO 20000-1 A.8"
    title: "Incident-Management"
    description: "Dokumentierter Incident-Prozess mit Eskalation"
    test: "Incident-Tickets, SLA-Einhaltung"
    frequency: laufend
    owner: CTO
  SV-03:
    origin: "ISO 20000-1 A.9"
    title: "Change-Management"
    description: "Alle Changes dokumentiert, CAB für kritische Changes"
    test: "Change-Log, CAB-Protokolle"
    frequency: laufend
    owner: CTO
  SV-04:
    origin: "ISO 20000-1 A.10"
    title: "Release-Management"
    description: "Release-Plan, Rollback-Plan, Test vor Release"
    test: "Release-Dokumentation, Rollback-Test"
    frequency: pro Release
    owner: CTO
  BC-03:
    origin: "ISO 22301 A.6"
    title: "BIA (Business Impact Analysis)"
    description: "Kritische Prozesse identifiziert, RTO/RPO definiert"
    test: "BIA-Dokument existiert"
    frequency: jährlich
    owner: CEO
  BC-04:
    origin: "ISO 22301 A.7"
    title: "Notfallpläne"
    description: "Pläne für: VPS-Ausfall, Datenverlust, Security-Incident"
    test: "Pläne existieren, getestet"
    frequency: jährlich
    owner: COO
  BC-05:
    origin: "ISO 22301 A.8"
    title: "BCM-Übung"
    description: "Jährliche BCM-Übung dokumentiert"
    test: "Übungsbericht existiert"
    frequency: jährlich
    owner: CEO
  SE-01:
    origin: "ISO 12207 A.5"
    title: "Anforderungsmanagement"
    description: "Anforderungen dokumentiert, versioniert, rückverfolgbar"
    test: "Anforderungsdokument existiert"
    frequency: pro Projekt
    owner: CPO
  SE-02:
    origin: "ISO 25010"
    title: "Code-Qualität"
    description: "Code-Reviews, Linting, Tests, keine TODOs im Main"
    test: "PR-Checkliste durchlaufen"
    frequency: pro PR
    owner: CTO
  SE-03:
    origin: "ISO 25010"
    title: "Architektur-Dokumentation"
    description: "Architektur-Entscheidungen dokumentiert (ADR)"
    test: "ADR-Log existiert"
    frequency: pro Entscheidung
    owner: CTO
  SE-04:
    origin: "ISO 12207 A.6"
    title: "Testmanagement"
    description: "Teststrategie, Testfälle, automatisierte Tests"
    test: "Testabdeckung >80%"
    frequency: pro Release
    owner: QA
  RB-01:
    origin: "VERBOT"
    title: "Keine Secrets in Repos"
    description: "API-Keys, Tokens, Passwörter niemals in Git"
    test: "Pre-Commit-Hook, Secret-Scan aktiv"
    frequency: bei jedem Commit
    owner: CTO
  RB-02:
    origin: "VERBOT"
    title: "Keine Production-Änderung ohne Rollback"
    description: "Jede Production-Änderung braucht Rollback-Plan"
    test: "Rollback-Schritte dokumentiert"
    frequency: pro Deployment
    owner: CTO
  RB-03:
    origin: "VERBOT"
    title: "Keine Kundendaten in unfreigegebene Modelle"
    description: "Keine PII an Modelle senden ohne Freigabe"
    test: "9Router-Filter aktiv"
    frequency: laufend
    owner: CISO
  RB-04:
    origin: "VERBOT"
    title: "Keine Merge ohne PR-Review"
    description: "Main-Branch nur per PR mit Review"
    test: "Branch-Protection aktiv"
    frequency: pro PR
    owner: CTO
  RB-05:
    origin: "VERBOT"
    title: "Kein Dashboard ohne Healthcheck"
    description: "Jeder öffentliche Service hat /health Endpoint"
    test: "Healthcheck-Dokumentation"
    frequency: einmalig
    owner: COO
  RB-06:
    origin: "VERBOT"
    title: "Kein Kundenprojekt ohne Tenant-Trennung"
    description: "Kundenprojekte strikt isoliert (Workspace/Systeme)"
    test: "Tenant-Isolation dokumentiert"
    frequency: pro Projekt
    owner: CEO
  RB-07:
    origin: "VERBOT"
    title: "Keine Abschlussmeldung ohne Evidence"
    description: "Jeder Task/Agent muss Dateien, Diffs, Tests, Quellen liefern"
    test: "DoD-Checklist"
    frequency: pro Task
    owner: QA
  RB-08:
    origin: "VERBOT"
    title: "Keine Secrets in Brain/Logs/Prompts"
    description: "Brain, Logs, Agenten-Prompts: keine Secrets"
    test: "Scan-Log, Filter aktiv"
    frequency: laufend
    owner: CISO
