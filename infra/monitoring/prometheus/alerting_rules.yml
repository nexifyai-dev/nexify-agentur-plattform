# NeXifyAI Prometheus Alerting Rules
# Severity: critical > warning > info

groups:
  # @NEXIFYAI-MARKER: phase-g6-local-ai-worker-alerts-20260713
  - name: nexifyai-critical
    interval: 30s
    rules:
      # ── System Health ──
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is DOWN"
          description: "Service {{ $labels.instance }} has been down for more than 2 minutes."

      - alert: HighCPUUsage
        expr: avg(rate(node_cpu_seconds_total{mode!="idle"}[5m])) by (instance) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU > 90% on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | humanize }}% for 5+ minutes."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RAM > 90% on {{ $labels.instance }}"
          description: "Available memory: {{ $value | humanize }}% used."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Disk < 20% free on {{ $labels.instance }}"
          description: "Disk {{ $labels.mountpoint }} has {{ $value | humanize }}% free."

      - alert: HighDiskUsage
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk < 10% free on {{ $labels.instance }}"
          description: "Disk {{ $labels.mountpoint }} has only {{ $value | humanize }}% free."

      # ── Docker Containers ──
      - alert: ContainerDown
        expr: time() - container_last_seen{name=~"(9router|headroom|lightrag.*|zitadel.*|twenty.*|nexify.*)"} > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} may be down"
          description: "Container {{ $labels.name }} last seen {{ $value }}s ago."

      # ── API Health ──
      - alert: APIUnreachable
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API {{ $labels.instance }} unreachable"
          description: "Health check failed for {{ $labels.instance }}."

      # ── TLS Cert Expiry ──
      - alert: CertificateExpiry
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 14
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expires in < 14 days"
          description: "Certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."

  # @NEXIFYAI-MARKER: phase-g6-hostinger-vps-alerts-20260713
